# 金价实时监控系统 - Docker Compose (纯 Web 模式)
# 使用: docker-compose up -d

version: '3.8'

services:
  # ============ 主服务（Web + 数据采集 + 告警） ============
  gold-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold-monitor
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - gold_data:/app/data
    environment:
      # 数据源
      - GOLD_DATA_SOURCE=${GOLD_DATA_SOURCE:-mock}
      - GOLD_FETCH_INTERVAL=${GOLD_FETCH_INTERVAL:-30}
      - GOLD_DATABASE_URL=sqlite:///data/gold_prices.db
      - GOLD_GOLDAPI_KEY=${GOLD_GOLDAPI_KEY:-}
      - GOLD_PRICE_HEARTBEAT_SECONDS=${GOLD_PRICE_HEARTBEAT_SECONDS:-300}
      - GOLD_DATA_RETENTION_DAYS=${GOLD_DATA_RETENTION_DAYS:-30}
      - GOLD_BACKUP_ENABLED=${GOLD_BACKUP_ENABLED:-false}
      - GOLD_BACKUP_INTERVAL_HOURS=${GOLD_BACKUP_INTERVAL_HOURS:-24}
      - GOLD_BACKUP_KEEP_COUNT=${GOLD_BACKUP_KEEP_COUNT:-7}
      - GOLD_BACKUP_PATH=/app/data/backups
      
      # 告警
      - GOLD_ALERT_THRESHOLD_PERCENT=${GOLD_ALERT_THRESHOLD_PERCENT:-1.0}
      - GOLD_ALERT_PRICE_UPPER=${GOLD_ALERT_PRICE_UPPER:-2500.0}
      - GOLD_ALERT_PRICE_LOWER=${GOLD_ALERT_PRICE_LOWER:-1800.0}
      - GOLD_ALERT_VOLATILITY_WINDOW=${GOLD_ALERT_VOLATILITY_WINDOW:-5}
      
      # 大模型
      - GOLD_LLM_PROVIDER=${GOLD_LLM_PROVIDER:-mock}
      - GOLD_ANTHROPIC_API_KEY=${GOLD_ANTHROPIC_API_KEY:-}
      - GOLD_OPENAI_API_KEY=${GOLD_OPENAI_API_KEY:-}
      - GOLD_OPENAI_BASE_URL=${GOLD_OPENAI_BASE_URL:-}
      - GOLD_TAVILY_API_KEY=${GOLD_TAVILY_API_KEY:-}
      - GOLD_LLM_CONFIG_PATH=${GOLD_LLM_CONFIG_PATH:-/app/data/llm_config.json}
      
      # 通知（可选）
      - GOLD_SMTP_HOST=${GOLD_SMTP_HOST:-}
      - GOLD_SMTP_PORT=${GOLD_SMTP_PORT:-587}
      - GOLD_SMTP_USERNAME=${GOLD_SMTP_USERNAME:-}
      - GOLD_SMTP_PASSWORD=${GOLD_SMTP_PASSWORD:-}
      - GOLD_ALERT_EMAIL_TO=${GOLD_ALERT_EMAIL_TO:-}
      - GOLD_WEBHOOK_URL=${GOLD_WEBHOOK_URL:-}
      - GOLD_WEBHOOK_TYPE=${GOLD_WEBHOOK_TYPE:-generic}
      - GOLD_TELEGRAM_BOT_TOKEN=${GOLD_TELEGRAM_BOT_TOKEN:-}
      - GOLD_TELEGRAM_CHAT_ID=${GOLD_TELEGRAM_CHAT_ID:-}

      # 安全
      - GOLD_ENABLE_AUTH=${GOLD_ENABLE_AUTH:-true}
      - GOLD_ADMIN_API_KEY=${GOLD_ADMIN_API_KEY:-}
      - GOLD_SECRET_KEY=${GOLD_SECRET_KEY:-}
      - GOLD_ENCRYPT_API_KEYS=${GOLD_ENCRYPT_API_KEYS:-true}
      - GOLD_CORS_ALLOW_ORIGINS=${GOLD_CORS_ALLOW_ORIGINS:-}
      - GOLD_RATE_LIMIT_PER_MINUTE=${GOLD_RATE_LIMIT_PER_MINUTE:-60}
      - GOLD_TRUSTED_PROXY_IPS=${GOLD_TRUSTED_PROXY_IPS:-127.0.0.1}
    healthcheck:
      test: ["CMD", "python", "-m", "gold_monitor.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - gold_network

  # ============ Nginx 反向代理（生产环境） ============
  nginx:
    image: nginx:alpine
    container_name: gold-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      gold-monitor:
        condition: service_healthy
    networks:
      - gold_network
    profiles:
      - production

volumes:
  gold_data:

networks:
  gold_network:
