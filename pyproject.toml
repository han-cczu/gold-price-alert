[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-price-alert"
version = "0.2.0"
description = "金价实时监控与智能分析系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "rich>=13.0",
    "httpx>=0.25",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiohttp>=3.9",
    "anthropic>=0.40",  # web_search 服务端工具（联网分析）
    "openai>=1.66",     # Responses API web_search 工具（联网分析）
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "websockets>=12.0",  # WebSocket 支持
    # P0: 安全依赖
    "cryptography>=41.0.0",  # 密钥加密（Fernet，敏感信息加密存储）
    # P1: 可观测性
    "prometheus-client>=0.19.0",  # 指标暴露
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1.0",  # 测试覆盖
    "ruff>=0.1.0",  # 代码检查
    "mypy>=1.8.0",  # 类型检查
]

[project.scripts]
gold-monitor = "gold_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gold_monitor = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
